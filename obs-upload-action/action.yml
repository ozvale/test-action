name: 'OBS Upload (OIDC)'
description: '通过 GitHub OIDC 认证，将文件上传到华为云 OBS（OIDC -> STS AssumeAgencyWithOIDC -> OBS putObject）'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  huawei-account-id:
    description: '华为云账号 ID'
    required: false
    default: '4d29a984c4fe4e6eb5d404a853d0084e'
  region:
    description: 'OBS 桶所在区域，如 cn-southwest-2'
    required: false
    default: 'cn-southwest-2'
  bucket:
    description: 'OBS 桶名称'
    required: false
    default: 'openlibing-export-beta'
  object-key:
    description: '上传的对象名（对象在桶内的完整路径，不含桶名），如 test/hello-oidc.txt'
    required: false
    default: 'test/hello-oidc.txt'
  file:
    description: '要上传的本地文件路径（可选）。未提供时使用 body 作为对象内容。'
    required: false
  body:
    description: '当未提供 file 时，作为上传的对象内容。'
    required: false
    default: 'Hello OBS via OIDC!'

outputs:
  etag:
    description: '上传对象的 ETag'

runs:
  using: 'node20'
  main: 'dist/index.js'
