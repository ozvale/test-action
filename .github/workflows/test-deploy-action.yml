name: Test Deploy Action

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 必须声明此权限，否则无法申请 OIDC JWT（这不是 secret，是 GitHub 的权限声明）
permissions:
  id-token: write
  contents: read

jobs:
  test-apig:
    name: 测试华为云 APIG 调用插件
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含插件源码）
        uses: actions/checkout@v4

      # 调试：解码 OIDC 令牌，核对 iss/aud/sub 是否与华为云信任策略一致
      - name: 查看 OIDC 令牌声明
        uses: ./inspect-oidc-action

      - name: 调用自研插件（本地路径引用，使用默认账号 ID）
        uses: ./deploy-action
        id: deploy
        env:
          # 诊断模式：配置永久 AK/SK（一个具备 APIG 权限的 IAM 用户），
          # 插件将跳过 OIDC/STS，直接用永久凭证调用 APIG，用于验证 APIG 的 IAM 认证是否正常。
          # 未配置时留空即可，插件自动走 OIDC + STS 临时凭证链路。
          HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
          HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}

      - name: 打印插件输出
        run: |
          echo "deploy-status: ${{ steps.deploy.outputs.deploy-status }}"

  test-obs:
    name: 测试华为云 OBS 上传插件
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含插件源码）
        uses: actions/checkout@v4

      # 调试：解码 OIDC 令牌，核对 iss/aud/sub 是否与华为云信任策略一致
      - name: 查看 OIDC 令牌声明
        uses: ./inspect-oidc-action

      - name: 生成待上传的测试文件
        run: |
          echo "Hello OBS via OIDC! time=$(date -u +%FT%TZ)" > ./hello-oidc.txt
          cat ./hello-oidc.txt

      - name: 通过 OIDC 上传文件到 OBS
        uses: ./obs-upload-action
        id: obs
        with:
          file: ./hello-oidc.txt

      - name: 打印 OBS 上传结果
        run: |
          echo "OBS etag: ${{ steps.obs.outputs.etag }}"
