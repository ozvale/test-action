name: Demo Action Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 必须声明此权限，否则无法申请 OIDC JWT（这不是 secret，是 GitHub 的权限声明）
permissions:
  id-token: write
  contents: read

jobs:
  demo:
    name: Demo SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run demo-action
        uses: ./.github/actions/demo-action
        with:
          file-path: ./README.md
