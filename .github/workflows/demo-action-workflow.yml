name: Demo Action Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 必须声明此权限，否则无法申请 OIDC JWT（这不是 secret，是 GitHub 的权限声明）
permissions:
  id-token: write
  contents: read

jobs:
  demo:
    name: Demo @openlibing/huaweicloud-oidc-client SDK (OIDC upload to OBS + call APIG)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (includes README.md)
        uses: actions/checkout@v4

      - name: Run demo-action (OIDC-based upload of root README.md to OBS, then call APIG)
        uses: ./.github/actions/demo-action
        with:
          file-path: ./README.md
