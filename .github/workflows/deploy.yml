name: Deploy npm Package

# 手动触发或打 tag 时发布（tag 形如 v1.0.0 / 1.0.0）
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate pack
        run: npm pack --dry-run

      - name: Test
        run: npm test

      - name: Verify version matches tag
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(npm pkg get version | tr -d '"')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($GITHUB_REF_NAME). 请先执行 npm version patch/minor/major 并推送 tag，或修正 package.json version 后重试。"
            exit 1
          fi
          echo "OK: version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      - name: Verify auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}