name: Deploy to Huawei Cloud

on:
  push:
    branches: [main]

# 必须声明此权限，否则无法申请 OIDC JWT（这不是 secret，是 GitHub 的权限声明）
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只需账号 ID，零 Secret 引用
      - name: Deploy app
        uses: your-org/deploy-action@v1
        id: deploy
        with:
          huawei-account-id: "12345678901234567890"

      - name: Show result
        run: echo "Status: ${{ steps.deploy.outputs.deploy-status }}"
